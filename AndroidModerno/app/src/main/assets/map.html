<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="referrer" content="strict-origin-when-cross-origin">
<style>
*{box-sizing:border-box}html,body,#map{width:100%;height:100%;padding:0;margin:0;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,Arial,sans-serif}#map{position:relative;background:#dfeee6}#tiles,#objects{position:absolute;inset:0;overflow:hidden;pointer-events:none}#tiles img{position:absolute;width:256px;height:256px;border:0;user-select:none;-webkit-user-drag:none}#route{position:absolute;inset:0;overflow:visible;pointer-events:none;width:100%;height:100%}.marker{position:absolute;transform:translate(-50%,-100%);border-radius:50% 50% 50% 4px;rotate:-45deg;width:34px;height:34px;background:#08734e;border:3px solid white;box-shadow:0 3px 12px #16362955;pointer-events:auto;display:grid;place-items:center;cursor:pointer}.marker:after{content:'●';rotate:45deg;color:white;font-size:13px}.marker.user{background:#1b74e4;border-radius:50%;rotate:none;width:19px;height:19px;transform:translate(-50%,-50%)}.marker.user:after{content:''}.marker.start{background:#ec9c30}.marker.end{background:#1f7b54}#controls{position:absolute;right:12px;top:12px;display:grid;gap:9px}#controls button{width:46px;height:46px;border:0;background:#fff;color:#07533d;box-shadow:0 2px 10px #153f3030;border-radius:14px;font-size:25px;font-weight:700}#attribution{position:absolute;bottom:0;right:0;padding:5px 8px;background:#ffffffed;border-radius:7px 0 0 0;font-size:11px;color:#19533e}#message{position:absolute;top:14px;left:12px;max-width:calc(100% - 86px);background:#fffffff1;border-radius:11px;padding:9px 12px;box-shadow:0 2px 10px #153f3025;font-size:12px;color:#254b3c;line-height:1.35;pointer-events:none}#detail{position:absolute;bottom:38px;left:12px;right:12px;background:white;padding:13px 15px;box-shadow:0 4px 17px #153f3040;border-radius:18px;display:none;align-items:center;gap:12px}#detail .grow{flex:1;min-width:0}#detail b{display:block;font-size:15px;color:#0b4936;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#detail span{font-size:12px;color:#556e62}#detail button{background:#08734e;color:white;border:0;padding:11px 14px;border-radius:12px;font-weight:700}#detail .close{color:#486b58;background:#eaf2ee;font-size:17px;padding:8px 12px}
</style></head>
<body><div id="map"><div id="tiles"></div><svg id="route"><polyline id="line" fill="none" stroke="#08734e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><div id="objects"></div><div id="message">Deslizá para moverte y usá + / − para acercar o alejar.</div><div id="controls"><button id="plus" aria-label="Acercar">+</button><button id="minus" aria-label="Alejar">−</button><button id="locate" aria-label="Centrar mapa">⌖</button></div><div id="detail"><div class="grow"><b id="name"></b><span id="subtitle"></span></div><button id="visit">Ver arribos</button><button id="close" class="close" aria-label="Cerrar">×</button></div><div id="attribution">© <a target="_blank" href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors</div></div>
<script>
'use strict';
// Tiles are requested ONLY for the visible viewport. Browser cache follows HTTP cache-control.
const map=document.getElementById('map'),tiles=document.getElementById('tiles'),objects=document.getElementById('objects'),line=document.getElementById('line'),notice=document.getElementById('message');
const MAX_Z=18,MIN_Z=4;let zoom=13,center={lat:-34.75,lon:-58.25},home={...center},points=[],route=[],myPosition=null,selected=-1;
const rad=Math.PI/180,clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function project(lat,lon,z=zoom){lat=clamp(lat,-85.0511,85.0511);const size=256*2**z;return {x:(lon+180)/360*size,y:(1-Math.log(Math.tan(lat*rad)+1/Math.cos(lat*rad))/Math.PI)/2*size};}
function unproject(x,y,z=zoom){const size=256*2**z,n=Math.PI-2*Math.PI*y/size;return {lat:Math.atan(Math.sinh(n))/rad,lon:x/size*360-180};}
function screen(lat,lon){const c=project(center.lat,center.lon),p=project(lat,lon);return {x:p.x-c.x+map.clientWidth/2,y:p.y-c.y+map.clientHeight/2};}
let drawPending=false;function schedule(){if(drawPending)return;drawPending=true;requestAnimationFrame(()=>{drawPending=false;draw();});}
function draw(){const cw=map.clientWidth,ch=map.clientHeight,c=project(center.lat,center.lon),firstX=Math.floor((c.x-cw/2)/256),lastX=Math.floor((c.x+cw/2)/256),firstY=Math.floor((c.y-ch/2)/256),lastY=Math.floor((c.y+ch/2)/256),max=2**zoom;const wanted=new Set();
 for(let y=firstY;y<=lastY;y++)for(let x=firstX;x<=lastX;x++){if(y<0||y>=max)continue;const wrapped=(x%max+max)%max,key=`${zoom}/${wrapped}/${y}`;wanted.add(key);let img=Array.from(tiles.children).find(e=>e.dataset.key===key);if(!img){img=document.createElement('img');img.dataset.key=key;img.alt='';img.draggable=false;img.onerror=()=>{notice.textContent='No se pudo cargar el mapa. Revisá tu conexión o abrí la ubicación en Maps.'};img.src=`https://tile.openstreetmap.org/${key}.png`;tiles.appendChild(img);}img.style.left=(x*256-c.x+cw/2)+'px';img.style.top=(y*256-c.y+ch/2)+'px';}
 for(const child of Array.from(tiles.children))if(!wanted.has(child.dataset.key))child.remove();
 const out=[];for(const p of route){const q=screen(p.lat,p.lon);out.push(`${q.x.toFixed(1)},${q.y.toFixed(1)}`);}line.setAttribute('points',out.join(' '));
 objects.textContent='';const entries=route.length>1?[{...route[0],type:'start'},{...route[route.length-1],type:'end'}]:(route.length===1?[{...route[0],type:'start'}]:points);
 entries.forEach((p,i)=>{const pos=screen(p.lat,p.lon);if(pos.x< -45||pos.y< -45||pos.x>cw+45||pos.y>ch+45)return;const el=document.createElement('button');el.className='marker '+(p.type||'');el.style.left=pos.x+'px';el.style.top=pos.y+'px';el.setAttribute('aria-label',p.label||'Parada');el.onclick=e=>{e.stopPropagation();select(i,route.length>0)};objects.appendChild(el)});
 if(myPosition){const pos=screen(myPosition.lat,myPosition.lon),me=document.createElement('div');me.className='marker user';me.style.left=pos.x+'px';me.style.top=pos.y+'px';objects.appendChild(me)}
}
function setCenter(lat,lon){if(Number.isFinite(lat)&&Number.isFinite(lon)){center={lat:clamp(lat,-85,85),lon:clamp(lon,-180,180)};home={...center};schedule()}}
function select(i,isRoute){const d=document.getElementById('detail'),p=(isRoute?(i===0?route[0]:route[route.length-1]):points[i]);if(!p)return;selected=isRoute||p.viewOnly?-1:i;document.getElementById('name').textContent=p.label||(isRoute?'Extremo del recorrido':'Parada');document.getElementById('subtitle').textContent=p.subtitle||'Tocá para consultar los próximos arribos';document.getElementById('visit').style.display=selected>=0?'':'none';d.style.display='flex';}
document.getElementById('visit').onclick=()=>{if(selected>=0)location.href='moqsa:stop:'+selected};document.getElementById('close').onclick=()=>document.getElementById('detail').style.display='none';
function fit(arr){if(!arr.length)return;let minLat=90,maxLat=-90,minLon=180,maxLon=-180;for(const p of arr){minLat=Math.min(minLat,p.lat);maxLat=Math.max(maxLat,p.lat);minLon=Math.min(minLon,p.lon);maxLon=Math.max(maxLon,p.lon)}center={lat:(minLat+maxLat)/2,lon:(minLon+maxLon)/2};home={...center};if(arr.length>1){for(let z=17;z>=MIN_Z;z--){const a=project(minLat,minLon,z),b=project(maxLat,maxLon,z);if(Math.abs(a.x-b.x)<=map.clientWidth-78&&Math.abs(a.y-b.y)<=map.clientHeight-115){zoom=z;break}}}schedule()}
window.moqsaSetData=function(data){points=(data.points||[]).filter(valid).slice(0,250);route=(data.route||[]).filter(valid).slice(0,1400);if(data.user&&valid(data.user))myPosition=data.user;if(data.center&&valid(data.center))center=data.center;if(route.length)fit(route);else if(points.length)fit(points);else if(data.center&&valid(data.center))setCenter(data.center.lat,data.center.lon);schedule();};
function valid(p){return p&&Number.isFinite(p.lat)&&Number.isFinite(p.lon)&&Math.abs(p.lat)<=85&&Math.abs(p.lon)<=180}
function changeZoom(d){const next=clamp(zoom+d,MIN_Z,MAX_Z);if(next!==zoom){zoom=next;schedule()}}
document.getElementById('plus').onclick=e=>{e.stopPropagation();changeZoom(1)};document.getElementById('minus').onclick=e=>{e.stopPropagation();changeZoom(-1)};document.getElementById('locate').onclick=e=>{e.stopPropagation();const p=myPosition||home;setCenter(p.lat,p.lon)};
let gesture=null;map.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('#detail')||e.target.closest('#attribution'))return;map.setPointerCapture(e.pointerId);gesture={x:e.clientX,y:e.clientY,start:project(center.lat,center.lon)};});map.addEventListener('pointermove',e=>{if(!gesture)return;const q=unproject(gesture.start.x-(e.clientX-gesture.x),gesture.start.y-(e.clientY-gesture.y));center={lat:q.lat,lon:q.lon};schedule()});map.addEventListener('pointerup',()=>gesture=null);map.addEventListener('pointercancel',()=>gesture=null);map.addEventListener('wheel',e=>{e.preventDefault();changeZoom(e.deltaY<0?1:-1)},{passive:false});
let touchDistance=0;map.addEventListener('touchmove',e=>{if(e.touches.length!==2){touchDistance=0;return}e.preventDefault();const a=e.touches[0],b=e.touches[1],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(touchDistance&&Math.abs(dist-touchDistance)>35){changeZoom(dist>touchDistance?1:-1);touchDistance=dist}else if(!touchDistance)touchDistance=dist},{passive:false});
window.addEventListener('resize',schedule);schedule();
</script></body></html>
