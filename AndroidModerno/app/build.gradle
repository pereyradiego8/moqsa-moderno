plugins { id 'com.android.application' }

android {
    namespace 'ar.com.cuandollega.moderno'
    compileSdk 35
    defaultConfig {
        applicationId 'ar.com.cuandollega.moderno'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.2.0-beta3'
    }
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField 'String', 'DEFAULT_API_BASE_URL', '"https://moqsa-moderno-api.vercel.app"'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
