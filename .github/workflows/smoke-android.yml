name: Diagnosticar inicio Android
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/smoke-android.yml'
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle :app:assembleDebug --no-daemon
      - name: Recrear parche DEX sin secretos
        run: python scripts/patch_fake_creds.py app/build/outputs/apk/debug/app-debug.apk /tmp/moqsa-fake-unsigned.apk
      - name: Generar certificado temporal del emulador
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -validity 365 -dname 'CN=Android Test Only'
      - name: Firmar copia de prueba con apksigner
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --v2-signing-enabled true --v3-signing-enabled true --out /tmp/moqsa-fake.apk /tmp/moqsa-fake-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose /tmp/moqsa-fake.apk
      - name: Permisos de KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Iniciar APK y recopilar errores
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r /tmp/moqsa-fake.apk
            adb logcat -c
            adb shell am start -W -n ar.com.colectivos.consulta/.MainActivity
            sleep 8
            adb shell pidof ar.com.colectivos.consulta > /tmp/moqsa.pid || true
            echo "=== PID ==="
            cat /tmp/moqsa.pid
            echo "=== AndroidRuntime errors ==="
            adb logcat -d -s AndroidRuntime:E ActivityTaskManager:E ActivityManager:E dalvikvm:E
            test -s /tmp/moqsa.pid
            echo 'APP SURVIVED LAUNCH WITH FAKE PRIVATE DEX'
