name: Diagnosticar SOAP original
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-original-soap.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS y alcance del servidor original
        run: |
          set +e
          getent hosts clswbsas.smartmovepro.net | awk '{print $1}' | head -n 2
          for scheme in http https; do
            echo "PROBE ${scheme}"
            curl -sS -L --max-time 15 -o /tmp/response-soap.txt -w 'HTTP_CODE=%{http_code} IP=%{remote_ip} SIZE=%{size_download} FINAL=%{url_effective}\n' "${scheme}://clswbsas.smartmovepro.net/ModuloParadas/SWParadas.asmx?WSDL"
            if [ "$scheme" = https ]; then
              python3 - <<'PY'
import re
s=open('/tmp/response-soap.txt').read()
for key in ['codigoEntidadSMP','codigoAplicacion','codigoLineaParada','usuario','clave']:
  matches=re.findall(r'<(?:s:)?element[^>]*?name="'+re.escape(key)+r'"[^>]*>',s,re.I)
  print('SCHEMA',key,' | '.join(matches[:2])[:350])
PY
            fi
            echo
          done
