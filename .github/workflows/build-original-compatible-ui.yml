name: Compilar interfaz para APK original
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['AndroidOriginalCompat/**', '.github/workflows/build-original-compatible-ui.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar modulo compatible
        working-directory: AndroidOriginalCompat
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MOQSA-Interfaz-Compat-Sin-Backend
          path: AndroidOriginalCompat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
