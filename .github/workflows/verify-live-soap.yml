name: Verificar backend SOAP real
# Test de entidad MOQSA
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/verify-live-soap.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consultar health y líneas reales de MOQSA
        env:
          API_URL: https://moqsa-moderno-api.vercel.app
        run: |
          node --input-type=module <<'JS'
          for (const path of ['/health','/v1/lineas','/v1/calles?linea=300']) {
            try {
              const controller=new AbortController();
              const timer=setTimeout(()=>controller.abort(),18000);
              const response=await fetch(process.env.API_URL+path,{signal:controller.signal});
              clearTimeout(timer);
              const body=await response.text();
              let parsed;try{parsed=JSON.parse(body)}catch{}
              console.log(JSON.stringify({path,http:response.status,contentType:response.headers.get('content-type'),ok:parsed?.ok,configured:parsed?.configured,items:parsed?.items?.length,mensaje:parsed?.mensaje,error:parsed?.error,bodyStart:parsed?undefined:body.slice(0,100)}));
              if(path==='/v1/lineas' && parsed?.items?.length)console.log('LINE_IDS',parsed.items.slice(0,12).map(x=>x.id).join(','));
            } catch(e) {console.log(path,'ERROR',e.message);}
          }
          JS
