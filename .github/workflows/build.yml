name: MOQSA Android directo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: node --check app/src/main/assets/live.js
      - name: Validar que se comparen los códigos de la misma línea
        run: |
          grep -q 'diagnosticPanel()' app/src/main/assets/live.js
          ! grep -q 'diagnose.arrivals' app/src/main/java/ar/com/colectivos/consulta/MainActivity.kt
      - name: Validar localidades y sentidos
        run: node scripts/check-ui.mjs
      - name: Verificar mapas y accesibilidad de arribos
        run: node scripts/check-maps.mjs
      - name: Comprobar tiempos, localidades y Cercanía GPS
        run: node scripts/check-ux.mjs
      - name: Validar ficha Cerca sin selección de línea
        run: node scripts/check-nearby-stop.mjs
      - name: Validar historial de navegación
        run: node scripts/check-navigation.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: moqsa-directo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
