name: MOQSA Android directo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: node --check app/src/main/assets/live.js
      - name: Verificar consultas independientes
        run: |
          ! grep -q 'diagnose.arrivals' app/src/main/java/ar/com/colectivos/consulta/MainActivity.kt
          grep -q 'otherLinesAtStop' app/src/main/assets/live.js
      - name: Validar localidades y sentidos
        run: node scripts/check-ui.mjs
      - name: Verificar mapas y accesibilidad de arribos
        run: node scripts/check-maps.mjs
      - name: Comprobar tiempos, localidades y Cercanía GPS
        run: node scripts/check-ux.mjs
      - name: Validar ficha Cerca sin selección de línea
        run: node scripts/check-nearby-stop.mjs
      - name: Validar otras líneas sin duplicar la seleccionada
        run: node scripts/check-other-lines.mjs
      - name: Validar historial de navegación
        run: node scripts/check-navigation.mjs
      - name: Validar catálogo y selección de recorridos
        run: node scripts/check-routes.mjs
      - name: Validar contrato SOAP y lectura de puntos
        run: node scripts/check-route-soap.mjs
      - name: Revisar responsive en todas las pantallas
        run: node scripts/check-responsive.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: moqsa-directo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      # Las APK debug de GitHub no son actualizables: cada runner crea otra firma.
      # La firma permanente se conserva exclusivamente como secret en GitHub.
      - name: Crear APK con firma permanente
        id: permanent_signature
        if: github.event_name != 'pull_request'
        env:
          MOQSA_KEYSTORE_B64: ${{ secrets.MOQSA_KEYSTORE_B64 }}
          MOQSA_KEYSTORE_PASSWORD: ${{ secrets.MOQSA_KEYSTORE_PASSWORD }}
          MOQSA_KEY_PASSWORD: ${{ secrets.MOQSA_KEY_PASSWORD }}
        run: |
          if [[ -z "$MOQSA_KEYSTORE_B64" || -z "$MOQSA_KEYSTORE_PASSWORD" || -z "$MOQSA_KEY_PASSWORD" ]]; then
            echo "No se encontraron todos los secretos de firma. Se publica solo la APK de prueba."
            exit 0
          fi
          KEYSTORE="$(mktemp)"
          trap 'rm -f "$KEYSTORE"' EXIT
          chmod 600 "$KEYSTORE"
          printf '%s' "$MOQSA_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          mkdir -p app/build/outputs/apk/signed
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-type PKCS12 \
            --ks-key-alias moqsa-actualizaciones \
            --ks-pass env:MOQSA_KEYSTORE_PASSWORD \
            --key-pass env:MOQSA_KEY_PASSWORD \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out app/build/outputs/apk/signed/MOQSA-Actualizacion.apk \
            app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/signed/MOQSA-Actualizacion.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.permanent_signature.outputs.signed == 'true'
        with:
          name: moqsa-actualizacion-firmada
          path: app/build/outputs/apk/signed/MOQSA-Actualizacion.apk
          if-no-files-found: error
          retention-days: 90
