name: Verificar API HTTPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BackendSoap/**'
      - '.github/workflows/smoke-backend.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar /health y rutas de API
        env:
          API_URL: https://moqsa-moderno-api.vercel.app
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.error
          base=os.environ["API_URL"]
          def fetch(path):
              try:
                  with urllib.request.urlopen(base+path, timeout=12) as resp: return resp.status, json.load(resp)
              except urllib.error.HTTPError as e:
                  try: return e.code,json.load(e)
                  except: return e.code,{}
          for attempt in range(8):
              try:
                  status,body=fetch('/health')
                  if status==200 and body.get('ok') is True: break
              except Exception: pass
              time.sleep(8)
          else: raise SystemExit('Error: /health no devuelve JSON operativo')
          print('Health:', status, 'configured:', body.get('configured'))
          status,body=fetch('/v1/lineas')
          assert status in (200,503),(status,body)
          assert isinstance(body,dict) and isinstance(body.get('ok'),bool),body
          if status==503: print('API expuesta. Falta acceso SOAP autorizado (503 esperado).')
          else: print('API conectada al SOAP:', len(body.get('items',[])), 'líneas.')
          status,body=fetch('/v1/calles')
          assert status==400,(status,body)
          print('Validación de parámetros: OK')
          PY
